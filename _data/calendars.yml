# Calendars shown on /calendar. One entry per PTA plus community feeds.
#
# Fields:
#   key        short slug, used for anchors
#   name       display name
#   kind       pta | council | district | community
#   color      hex color used in the combined embed (Google Calendar palette values render best)
#   google_id  the Google Calendar ID (looks like an email address, or ...@group.calendar.google.com).
#              Leave the key out until the calendar exists and is set to public; the page then shows
#              the entry as "coming soon" instead of adding it to the embed.
#   ics        a public iCalendar URL for feeds that live outside Google (district, sports leagues)
#   site       the organization's own website, if any
#
# PTA keys match _data/ptas.yml, the PTA registry.
#
# To add or change a calendar, edit this file and open a pull request ("Improve this page" in the footer).

