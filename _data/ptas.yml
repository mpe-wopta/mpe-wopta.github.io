# The PTA registry: one row per PTA in the West Orange district, and the single definition
# that the site, the Workspace accounts, and later Knarr and Leidangr all read.
#
# Fields:
#   key        canonical short name. It is the Workspace account (<key>@wopta.org), the planned
#              subdomain (<key>.wopta.org), and the scope id elsewhere (group/pta-<key>).
#              Never renamed once an account exists.
#   name       what the PTA calls itself, where known
#   school     the school it serves
#   level      elementary | middle | high | council
#   aliases    extra addresses that deliver to the account; added when a PTA asks
#   account    not-created | placeholder | stewarded
#                placeholder: the account exists and the Council keeps its calendar,
#                  entering or mirroring events as needed
#                stewarded: at least two of the PTA's own board are delegates
#   calendar   none | own | mirror
#                own: events are entered in this account's public calendar
#                mirror: the PTA runs a calendar elsewhere and this one copies it
#   school_site the district's page for the school
#   notes      anything else worth knowing
#
# Contact details for each PTA are deliberately not kept here; this file is public.

- key: gregory
  name: Gregory School PTA
  school: Gregory Elementary School
  level: elementary
  aliases: []
  account: not-created
  calendar: none
  school_site: https://ges.woboe.org/

